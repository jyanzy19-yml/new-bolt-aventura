name: Godot validation
on:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - '.godot-version'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'scenes/**'
      - 'scripts/**'
      - 'resources/**'
      - 'tests/**'
      - 'assets/**'
      - 'addons/**'
      - '.github/workflows/godot-validation.yml'
  pull_request:
    paths:
      - 'project.godot'
      - '.godot-version'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'scenes/**'
      - 'scripts/**'
      - 'resources/**'
      - 'tests/**'
      - 'assets/**'
      - 'addons/**'
      - '.github/workflows/godot-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Conditional Godot import and script parse
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f project.godot ]]; then
            echo "::error::project.godot is absent; Godot validation cannot be skipped."
            exit 1
          fi
          if [[ ! -f .godot-version ]]; then
            echo "::error::project.godot exists but .godot-version is missing."
            exit 1
          fi
          GODOT_VERSION="$(tr -d '[:space:]' < .godot-version)"
          if [[ ! "$GODOT_VERSION" =~ ^4\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected exact stable Godot 4.x.y; found '$GODOT_VERSION'."
            exit 1
          fi
          ARCHIVE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${ARCHIVE}"
          curl --fail --location --retry 3 "$URL" --output godot.zip
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test -f "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ACTUAL_VERSION="$("$GODOT_BIN" --headless --version)"
          [[ "$ACTUAL_VERSION" == "$GODOT_VERSION".* ]]

          run_checked() {
            local label="$1"
            shift
            local log="${label}.log"
            set +e
            "$@" 2>&1 | tee "$log"
            local command_status=${PIPESTATUS[0]}
            set -e
            if [[ $command_status -ne 0 ]]; then
              echo "::error::${label} exited with status $command_status."
              return 1
            fi
            if grep -nE 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$log" | grep -vE 'SceneFlow: cena inexistente: res://nao_existe.tscn|audio_driver_alsa|ERR_CANT_OPEN.*audio'; then
              echo "::error::Unexpected Godot error in ${label}; see ${log}."
              return 1
            fi
          }

          "$GODOT_BIN" --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          if grep -nE 'SCRIPT ERROR:|Parse Error:|^ERROR:' godot-import.log; then
            echo "::error::Unexpected import/parse error."
            exit 1
          fi

          run_checked godot-tests "$GODOT_BIN" --headless --path . --script res://tests/test_runner.gd

          # Mutation check: restore the pre-fix direct autoload reference in the menu.
          # The threaded-scene regression must reject this old implementation.
          cp scripts/ui/main_menu.gd main-menu-fixed.gd
          trap 'cp main-menu-fixed.gd scripts/ui/main_menu.gd' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ui/main_menu.gd")
          source = path.read_text()
          old = 'return get_node_or_null("/root/CampaignProgress")'
          new = 'return CampaignProgress'
          if old not in source:
              raise SystemExit("Mutation target not found; refusing a vacuous mutation check.")
          path.write_text(source.replace(old, new, 1))
          PY
          set +e
          "$GODOT_BIN" --headless --editor --path . --import --quit > mutation-import.log 2>&1
          import_status=$?
          "$GODOT_BIN" --headless --path . --script res://tests/test_runner.gd > mutation-tests.log 2>&1
          mutation_status=$?
          set -e
          cp main-menu-fixed.gd scripts/ui/main_menu.gd
          rm -f main-menu-fixed.gd
          trap - EXIT
          cat mutation-import.log mutation-tests.log
          if [[ $import_status -eq 0 && $mutation_status -eq 0 ]] && ! grep -nE 'main_menu.tscn|Parse Error:|SCRIPT ERROR:' mutation-import.log mutation-tests.log; then
            echo "::error::Threaded autoload regression survived the old-code mutation."
            exit 1
          fi
          if ! grep -nE 'main_menu.tscn|Parse Error:|SCRIPT ERROR:' mutation-import.log mutation-tests.log; then
            echo "::error::Mutation failed for an unrelated reason; no evidence that the regression detected the old menu code."
            exit 1
          fi
          "$GODOT_BIN" --headless --editor --path . --import --quit > godot-restore-import.log 2>&1
          if grep -nE 'SCRIPT ERROR:|Parse Error:|^ERROR:' godot-restore-import.log; then
            echo "::error::Restored source did not import cleanly after mutation verification."
            exit 1
          fi
          echo "Mutation check passed: the pre-fix direct-autoload menu implementation was detected."

          echo "Running 20 real project boots (300 frames each, fixed 60 FPS)."
          for run in $(seq 1 20); do
            echo "Boot smoke ${run}/20"
            run_checked "boot-${run}" "$GODOT_BIN" --headless --path . --fixed-fps 60 --quit-after 300
          done
          echo "Boot smoke passed: 20/20 process launches."
          echo "This does not prove Android export, rendering, touch hardware or physical-device performance."

name: Godot validation
on:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - '.godot-version'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'scenes/**'
      - 'scripts/**'
      - 'resources/**'
      - 'tests/**'
      - 'assets/**'
      - 'addons/**'
      - '.github/workflows/godot-validation.yml'
  pull_request:
    paths:
      - 'project.godot'
      - '.godot-version'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'scenes/**'
      - 'scripts/**'
      - 'resources/**'
      - 'tests/**'
      - 'assets/**'
      - 'addons/**'
      - '.github/workflows/godot-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Conditional Godot import and script parse
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f project.godot ]]; then
            echo "::notice::NOT APPLICABLE — project.godot is absent; no engine test was performed."
            exit 0
          fi
          if [[ ! -f .godot-version ]]; then
            echo "::error::project.godot exists but .godot-version is missing."
            exit 1
          fi
          GODOT_VERSION="$(tr -d '[:space:]' < .godot-version)"
          if [[ ! "$GODOT_VERSION" =~ ^4\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected exact stable Godot 4.x.y; found '$GODOT_VERSION'."
            exit 1
          fi
          ARCHIVE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${ARCHIVE}"
          curl --fail --location --retry 3 "$URL" --output godot.zip
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test -f "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ACTUAL_VERSION="$("$GODOT_BIN" --headless --version)"
          [[ "$ACTUAL_VERSION" == "$GODOT_VERSION".* ]]
          "$GODOT_BIN" --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          echo "Headless import/parse passed for Godot $GODOT_VERSION."
          "$GODOT_BIN" --headless --path . --script res://tests/test_runner.gd 2>&1 | tee godot-tests.log
          if grep -nE "SCRIPT ERROR:|Parse Error:|^ERROR:.*(Function blocked during in/out signal|flushing queries)" godot-import.log godot-tests.log; then
            echo "::error::Godot reported a script or parse error; refusing a green validation."
            exit 1
          fi
          echo "Headless project test suite passed."
          echo "This does not prove Android export, rendering, touch hardware or physical-device performance."

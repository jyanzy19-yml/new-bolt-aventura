name: Godot validation
on:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - '.godot-version'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'scenes/**'
      - 'scripts/**'
      - 'resources/**'
      - 'tests/**'
      - 'assets/**'
      - 'addons/**'
      - '.github/workflows/godot-validation.yml'
  pull_request:
    paths:
      - 'project.godot'
      - '.godot-version'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'scenes/**'
      - 'scripts/**'
      - 'resources/**'
      - 'tests/**'
      - 'assets/**'
      - 'addons/**'
      - '.github/workflows/godot-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Conditional Godot import and script parse
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f project.godot ]]; then
            echo "::error::project.godot is absent; Godot validation cannot be skipped."
            exit 1
          fi
          if [[ ! -f .godot-version ]]; then
            echo "::error::project.godot exists but .godot-version is missing."
            exit 1
          fi
          GODOT_VERSION="$(tr -d '[:space:]' < .godot-version)"
          if [[ ! "$GODOT_VERSION" =~ ^4\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected exact stable Godot 4.x.y; found '$GODOT_VERSION'."
            exit 1
          fi
          ARCHIVE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${ARCHIVE}"
          curl --fail --location --retry 3 "$URL" --output godot.zip
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test -f "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ACTUAL_VERSION="$("$GODOT_BIN" --headless --version)"
          [[ "$ACTUAL_VERSION" == "$GODOT_VERSION".* ]]

          run_checked() {
            local label="$1"
            shift
            local log="${label}.log"
            set +e
            "$@" 2>&1 | tee "$log"
            local command_status=${PIPESTATUS[0]}
            set -e
            if [[ $command_status -ne 0 ]]; then
              echo "::error::${label} exited with status $command_status."
              return 1
            fi
            # Expected diagnostics only: test_scene_flow.gd deliberately exercises one missing
            # scene and two _fail() paths; headless runners may also lack ALSA audio hardware.
            # Any other SCRIPT ERROR, Parse Error or ERROR fails CI.
            if grep -nE 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$log" | grep -vE "SceneFlow: cena inexistente: res://nao_existe.tscn|SceneFlow: transição para 'res://test_failure_from_unpaused_state.tscn' falhou \\(test_failure\\)|SceneFlow: transição para 'res://test_failure_from_paused_state.tscn' falhou \\(test_failure\\)|audio_driver_alsa|ERR_CANT_OPEN.*audio"; then
              echo "::error::Unexpected Godot error in ${label}; see ${log}."
              return 1
            fi
          }

          "$GODOT_BIN" --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          if grep -nE 'SCRIPT ERROR:|Parse Error:|^ERROR:' godot-import.log | grep -vE 'audio_driver_alsa|ERR_CANT_OPEN.*audio'; then
            echo "::error::Unexpected import/parse error."
            exit 1
          fi

          run_checked godot-tests "$GODOT_BIN" --headless --path . --script res://tests/test_runner.gd

          # Capture verbose diagnostics from one fresh boot before mutation or repeated runs.
          set +e
          "$GODOT_BIN" --headless --path . --verbose --fixed-fps 60 --quit-after 300 > boot-diagnostic.log 2>&1
          diagnostic_status=$?
          set -e
          echo "Verbose cold-boot diagnostic exit: $diagnostic_status"
          grep -nEi 'main_menu|SCRIPT ERROR|Parse Error|ERROR:|failed|failed loading|loading resource' boot-diagnostic.log | tail -120 || true

          echo "Running 20 real project boots (300 frames each, fixed 60 FPS)."
          for run in $(seq 1 20); do
            echo "Boot smoke ${run}/20"
            run_checked "boot-${run}" "$GODOT_BIN" --headless --path . --fixed-fps 60 --quit-after 300
          done
          echo "Boot smoke passed: 20/20 process launches."

          # Cold-process mutation matrix. The boot smoke above runs before any mutation.
          cp scripts/ui/main_menu.gd main-menu-fixed.gd
          cp scripts/core/boot.gd boot-fixed.gd
          trap 'cp main-menu-fixed.gd scripts/ui/main_menu.gd; cp boot-fixed.gd scripts/core/boot.gd' EXIT

          # Mutation A: remove only the synchronous script prewarm.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/core/boot.gd")
          source = path.read_text()
          tab = chr(9)
          nl = chr(10)
          block = (
              tab + '# Compila/carrega o script leve do menu na thread principal antes do PackedScene' + nl
              + tab + '# ser solicitado por SceneFlow via ResourceLoader threaded.' + nl
              + tab + '_main_menu_script = load(MAIN_MENU_SCRIPT_PATH) as Script' + nl
              + tab + 'if _main_menu_script == null:' + nl
              + tab + tab + 'push_error("Boot: falha ao carregar o script do menu.")' + nl
              + tab + tab + '_status.text = "Falha ao preparar o menu principal."' + nl
              + tab + tab + 'return' + nl
          )
          if block not in source:
              raise SystemExit("Menu script prewarm mutation target missing.")
          path.write_text(source.replace(block, "", 1))
          PY
          set +e
          "$GODOT_BIN" --headless --path . --fixed-fps 60 --quit-after 300 > mutation-no-prewarm.log 2>&1
          no_prewarm_status=$?
          set -e
          if grep -qE 'Parse Error: Failed.*main_menu.tscn|Failed loading resource: res://scenes/ui/main_menu.tscn' mutation-no-prewarm.log; then
            echo "Removing main-thread script prewarm reproduced the menu failure (status $no_prewarm_status)."
          else
            echo "Removing main-thread script prewarm alone did not reproduce."
          fi

          # Restore Boot; Mutation B restores direct autoload identifiers in the menu.
          cp boot-fixed.gd scripts/core/boot.gd
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ui/main_menu.gd")
          source = path.read_text()
          mutations = {
              'return get_node_or_null("/root/CampaignProgress")': 'return CampaignProgress',
              'return get_node_or_null("/root/SaveSystem")': 'return SaveSystem',
          }
          for old, new in mutations.items():
              if old not in source:
                  raise SystemExit(f"Menu mutation target missing: {old}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          set +e
          "$GODOT_BIN" --headless --path . --fixed-fps 60 --quit-after 300 > mutation-direct-autoload.log 2>&1
          direct_autoload_status=$?
          set -e
          if grep -qE 'Parse Error: Failed.*main_menu.tscn|Failed loading resource: res://scenes/ui/main_menu.tscn' mutation-direct-autoload.log; then
            echo "Direct-autoload mutation reproduced the menu failure (status $direct_autoload_status)."
          else
            echo "Direct-autoload mutation alone did not reproduce with main-thread script prewarm."
          fi

          # Combined original behavior must reproduce the reported defect.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/core/boot.gd")
          source = path.read_text()
          tab = chr(9)
          nl = chr(10)
          block = (
              tab + '# Compila/carrega o script leve do menu na thread principal antes do PackedScene' + nl
              + tab + '# ser solicitado por SceneFlow via ResourceLoader threaded.' + nl
              + tab + '_main_menu_script = load(MAIN_MENU_SCRIPT_PATH) as Script' + nl
              + tab + 'if _main_menu_script == null:' + nl
              + tab + tab + 'push_error("Boot: falha ao carregar o script do menu.")' + nl
              + tab + tab + '_status.text = "Falha ao preparar o menu principal."' + nl
              + tab + tab + 'return' + nl
          )
          if block not in source:
              raise SystemExit("Combined mutation could not remove script prewarm.")
          path.write_text(source.replace(block, "", 1))
          menu_path = Path("scripts/ui/main_menu.gd")
          menu = menu_path.read_text()
          menu = menu.replace('return get_node_or_null("/root/CampaignProgress")', 'return CampaignProgress', 1)
          menu = menu.replace('return get_node_or_null("/root/SaveSystem")', 'return SaveSystem', 1)
          menu_path.write_text(menu)
          PY
          set +e
          "$GODOT_BIN" --headless --path . --fixed-fps 60 --quit-after 300 > mutation-original-combined.log 2>&1
          combined_mutation_status=$?
          set -e
          if ! grep -qE 'Parse Error: Failed.*main_menu.tscn|Failed loading resource: res://scenes/ui/main_menu.tscn' mutation-original-combined.log; then
            echo "::error::Combined pre-fix implementation did not reproduce the reported main-menu failure."
            cat mutation-no-prewarm.log mutation-direct-autoload.log mutation-original-combined.log
            exit 1
          fi
          echo "Original combined implementation reproduced the main-menu failure (status $combined_mutation_status)."

          cp main-menu-fixed.gd scripts/ui/main_menu.gd
          cp boot-fixed.gd scripts/core/boot.gd
          rm -f main-menu-fixed.gd boot-fixed.gd
          trap - EXIT
          "$GODOT_BIN" --headless --editor --path . --import --quit > godot-restore-import.log 2>&1
          if grep -nE 'SCRIPT ERROR:|Parse Error:|^ERROR:' godot-restore-import.log | grep -vE 'audio_driver_alsa|ERR_CANT_OPEN.*audio'; then
            echo "::error::Restored source did not import cleanly after mutation verification."
            exit 1
          fi
          echo "Mutation matrix passed: the original combined implementation was detected."



          echo "This does not prove Android export, rendering, touch hardware or physical-device performance."

name: BOLT documentation validation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "MASTER_DIRECTIVE.md"
      - "docs/**"
      - ".claude/**"
      - "scripts/validate_project_docs.py"
      - ".github/workflows/docs-validation.yml"
  pull_request:
    paths:
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/**"
      - "scripts/validate_project_docs.py"
      - ".github/workflows/docs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Claude metadata and local links
        run: python scripts/validate_project_docs.py

name: Temporary npm lockfile bootstrap

on:
  push:
    branches: [chore/generate-lockfile]

permissions:
  contents: write

concurrency:
  group: lockfile-bootstrap
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/generate-lockfile
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "build: add reproducible npm lockfile"
            git push origin HEAD:chore/generate-lockfile
          fi

name: Proposta de melhoria
description: Sugira uma melhoria técnica ou de experiência.
title: "[FEATURE] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou oportunidade
      description: Qual necessidade real esta proposta atende?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Explique o comportamento desejado sem presumir aprovação de canon.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas e trade-offs
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Gameplay
        - Level design
        - Narrativa
        - Arte e áudio
        - UI/UX
        - Android e performance
        - Arquitetura e tooling
        - QA
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Entendo que propostas de canon precisam de aprovação do usuário.
          required: true

name: Relatório de bug
description: Registre um defeito reproduzível no BOLT · AVENTURA.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: "Relate apenas comportamento observado. Não inclua senhas, tokens ou dados pessoais."
  - type: textarea
    id: summary
    attributes:
      label: Resumo
      description: O que está errado?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Navegador/WebView, Android, aparelho, versão e build.
  - type: dropdown
    id: severity
    attributes:
      label: Impacto
      options:
        - Bloqueia progressão ou impede iniciar
        - Afeta gameplay/controles
        - Afeta visual/áudio
        - Problema menor
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Logs, screenshots ou vídeo sem informações sensíveis.
